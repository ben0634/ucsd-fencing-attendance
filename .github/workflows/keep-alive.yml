name: Keep Supabase Active

on:
  schedule:
    # Run every Monday at 12:00 PM UTC (4 AM PST / 5 AM PDT)
    - cron: '0 12 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Ping deployment to keep Supabase active
        id: ping
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing Supabase secrets: NEXT_PUBLIC_SUPABASE_URL and/or NEXT_PUBLIC_SUPABASE_ANON_KEY"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "Pinging Supabase REST API to prevent the database from pausing..."
          RESPONSE=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/attendance?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP Status: $RESPONSE"
          if [[ "$RESPONSE" =~ ^2[0-9][0-9]$ ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "Ping completed successfully!"
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "Ping failed with status $RESPONSE"
          fi
      
      - name: Send email notification
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "UCSD Fencing - Weekly Keep-Alive Ping ${{ steps.ping.outputs.status == 'success' && '✅' || '❌' }}"
          to: benkim0634@gmail.com
          from: UCSD Fencing Bot
          body: |
            Weekly keep-alive ping completed.
            
            Status: ${{ steps.ping.outputs.status }}
            Time: ${{ github.event.repository.updated_at }}
            
            Your Supabase database remains active!
